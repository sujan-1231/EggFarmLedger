name: Build iOS Simulator App

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and build web assets
        run: |
          npm install
          npm run build
          npx cap sync ios

      - name: Build unsigned iOS Simulator app
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Run in iOS Simulator and take screenshot
        run: |
          APP_ID=$(node -e "const fs = require('fs'); const cfg = fs.readFileSync('capacitor.config.ts', 'utf8'); const m = cfg.match(/appId:\s*['\"]([^'\"]+)['\"]/); console.log(m ? m[1] : 'io.ionic.starter');")
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl install booted ios/App/build/Build/Products/Release-iphonesimulator/App.app
          xcrun simctl launch booted "$APP_ID"
          sleep 5
          xcrun simctl io booted screenshot simulator-screen.png

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Simulator-Preview
          path: simulator-screen.png

      - name: Upload App.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: EggFarmLedger-iOS-Simulator
          path: ios/App/build/Build/Products/Release-iphonesimulator/App.app
